name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  reviewed-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a commit already merged to main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Require the tag to match package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"

  verify:
    needs: reviewed-source
    uses: ./.github/workflows/ci.yml

  # Drafts only. Publishing an immutable release locks the tag and its assets,
  # so a person publishes the draft after checking it.
  draft:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # renovate: datasource=node-version depName=node
          node-version: 24.22.2
      - run: npm ci --ignore-scripts
      - name: Pack
        run: |
          mkdir dist-release
          npm pack --pack-destination dist-release
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist-release/*.tgz
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tarball=$(ls dist-release/*.tgz)
          name=$(basename "$tarball")
          integrity="sha512-$(openssl dgst -sha512 -binary "$tarball" | openssl base64 -A)"
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$name"
          {
            echo "Install with:"
            echo
            echo '```sh'
            echo "npm install $url"
            echo '```'
            echo
            echo "Tarball integrity: \`$integrity\`"
          } > notes.md
          gh release create "$GITHUB_REF_NAME" "$tarball" --draft --verify-tag \
            --title "$GITHUB_REF_NAME" --notes-file notes.md
