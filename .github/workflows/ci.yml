name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.ref_name == 'main' && github.run_id || 'pr' }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # renovate: datasource=node-version depName=node
          node-version: 24.22.2
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      # The tests import the TypeScript source; this proves the tarball a
      # consumer installs carries both entries, that they load, and that a
      # Worker bundling the runtime entry gets the primitive and nothing else.
      - name: Install the packed tarball, import it, and bundle the runtime entry
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          consumer="$RUNNER_TEMP/consumer"
          mkdir "$consumer"
          (
            cd "$consumer"
            npm init --yes >/dev/null
            npm install --ignore-scripts "$RUNNER_TEMP"/curlewlabs-com-worker-lazy-*.tgz
            node --input-type=module -e '
              import { lazy, withLazy } from "@curlewlabs-com/worker-lazy";
              import plugin from "@curlewlabs-com/worker-lazy/eslint";
              const load = lazy(() => Promise.resolve({ v: 1 }), { partition: "p", operation: "o" });
              if ((await withLazy(load, (m) => m.v)) !== 1) throw new Error("cold path");
              if (withLazy(load, (m) => m.v) !== 1) throw new Error("warm path was not synchronous");
              if (Object.keys(plugin.rules).length !== 3) throw new Error("lint entry");
            '
          )
          node scripts/check-runtime-bundle.ts "$consumer"

  # The one check branch protection requires, so adding a job means listing it
  # here rather than in the repository settings.
  conclusion:
    needs: [test]
    runs-on: ubuntu-24.04
    if: always()
    steps:
      - name: Require every job to pass
        env:
          TEST: ${{ needs.test.result }}
        run: test "$TEST" = success
